<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHATFIT 3- Identification Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="quiz-card">

        <h1>PHATFIT 3</h1>
        <p class="subtitle">QUIZ - Identification Quiz</p>

        <div id="quiz">

            <div class="instructions">
                Type your answer in the box, then click Check Answer.
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="question-number" id="questionNumber"></div>

            <div class="question" id="question"></div>

            <input
                type="text"
                id="answerInput"
                class="answer-input"
                placeholder="Type your answer here..."
                autocomplete="off"
            >

            <button class="check-btn" id="checkButton" onclick="checkAnswer()">
                Check Answer
            </button>

            <div id="feedback" class="feedback"></div>

            <button class="next-btn" id="nextButton" onclick="nextQuestion()">
                Next Question
            </button>

        </div>

        <div id="result" class="result" style="display: none;">
            <h2>Quiz Complete!</h2>
            <p>Your final score:</p>

            <div class="score" id="score"></div>

            <p id="resultMessage"></p>

            <button class="restart-btn" onclick="startQuiz()">
                Repeat Quiz
            </button>
        </div>

        <p class="source">
            Based on the PHATFIT 3 pointer.
        </p>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
